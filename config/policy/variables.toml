# Closed variable vocabulary for policy rules (reviewed like code). Units come from a closed set.
[variables."attendance.absent_periods"]
type = "integer"
unit = "period"
min = 0
max = 300
label = "Số tiết đã vắng"
input = "USER"

[variables."course.total_periods"]
type = "integer"
unit = "period"
min = 1
max = 300
label = "Tổng số tiết của học phần"
input = "USER"

[variables."attendance.absent_ratio"]
type = "number"
unit = "percent"
min = 0
max = 100
step = 0.5
label = "Tỉ lệ số tiết vắng mặt"
input = "USER"
derive = "attendance.absent_periods / course.total_periods * 100"

[variables."grade.process_score"]
type = "number"
unit = "point10"
min = 0
max = 10
step = 0.1
label = "Điểm quá trình"
input = "USER"

[variables."grade.final_exam_score"]
type = "number"
unit = "point10"
min = 0
max = 10
step = 0.1
label = "Điểm thi kết thúc học phần"
input = "USER"

[variables."grade.course_score"]
type = "number"
unit = "point10"
min = 0
max = 10
step = 0.1
label = "Điểm học phần"
input = "USER"

[variables."student.cohort"]
type = "string"
pattern = "^[0-9]{2}$"
label = "Khóa (ví dụ 66)"
input = "PROFILE"

[variables."discipline.level"]
type = "enum"
values = ["NONE", "REPRIMAND", "WARNING", "SUSPENSION"]
label = "Mức kỷ luật hiện tại"
input = "USER"
