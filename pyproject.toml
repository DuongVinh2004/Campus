[project]
name = "campus247"
version = "0.1.0"
description = "Campus 24/7 — HUCE Demo backend application and services"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph==1.2.24",
    "langchain-core==1.8.4",
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pgvector==0.5.1",
    "redis==6.4.0",
    "httpx==0.28.1",
    "openai==3.57.0",
    "tiktoken==0.14.0",
    "tzdata==2026.6",
    "pypdf==6.21.4",
    "python-multipart==0.0.34",
    "pdfplumber==0.11.10",
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-sqlalchemy==0.66b0",
    "opentelemetry-instrumentation-redis==0.66b0",
    "langfuse==4.17.0",
    "numpy==2.5.5",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "pytest-mock==3.17.0",
    "pytest-benchmark==5.3.1",
    "locust==2.47.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
pythonpath = ["services/api/src", "packages/synthetic/src"]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ['services/api/src', 'packages/synthetic/src']
namespaces = true

[tool.campus247.dependency-approval]
reference = "DIRECT-HUMAN-2026-11-21-SECURITY-UPDATES-001"
candidate-lock-sha256 = "beb290369b0e1397ef564abb953aa7b9907c3ec8bbd657855617bc8a832b51ce"
review = "tests/unit/dependency_resolution/dependency-review.json"




