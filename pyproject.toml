[project]
name = "campus247"
version = "0.1.0"
description = "Campus 24/7 — HUCE Demo backend application and services"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph==1.2.12",
    "langchain-core==1.6.3",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pgvector==0.5.0",
    "redis==6.4.0",
    "httpx==0.28.1",
    "openai==3.24.0",
    "tiktoken==0.14.0",
    "pypdf==6.19.0",
    "python-multipart==0.0.32",
    "pdfplumber==0.11.10",
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-sqlalchemy==0.66b0",
    "opentelemetry-instrumentation-redis==0.66b0",
    "langfuse==4.17.0",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "pytest-mock==3.16.0",
    "pytest-benchmark==5.3.0",
    "locust==2.46.7",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
pythonpath = ["services/api/src", "packages/synthetic/src"]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ['services/api/src', 'packages/synthetic/src']
namespaces = true

[tool.campus247.dependency-approval]
reference = "DIRECT-HUMAN-2026-11-03-STACK-002"
candidate-lock-sha256 = "251e0a8fbd1f5910abd30105a3a0e6b63f6ab9a51244d209cfc29848b2dbce46"
review = "tests/unit/dependency_resolution/dependency-review.json"




