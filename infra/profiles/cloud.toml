# Runtime profile: cloud VM, Linux, 4 vCPU / 8 GB, non-burstable CPU (locked 2026-11-15).
# Same codebase as local.toml; only these values differ. Not started anywhere yet: phase 2 deploys it.
name = "cloud"

[api]
workers = 2
max_in_flight_per_worker = 16
provider_concurrency = 24

[postgres]
shared_buffers = "256MB"
max_connections = 40

[gateway]
# TEMPORARY placeholders so a cloud gateway can never run uncapped. The real daily cap is the owner's decision and
# must replace these before phase 2 deploys anything.
port = 8025
daily_usd_cap = "5.00"
daily_call_cap = 2000

[memory]
reserve_mb = 768
postgres_mb = 350
frontend_mb = 200
api_worker_mb = 870
worker_mb = 300
gateway_mb = 150
# ClamAV daemon (learning-module upload scanning): measured 960 MB resident, 972 MB peak on 2026-11-17.
scanner_mb = 1000
# Local speech recognition (F8.4, faster-whisper small int8, 4 threads): measured 384 MB resident after load and three
# clips, 697 MB peak, on 2026-11-26. Loaded lazily by scripts/serve_asr.py only while free RAM >= asr_mb + 500 MB.
asr_mb = 700
