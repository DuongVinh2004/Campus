# ClamAV daemon for the Campus 24/7 cloud VM (Ubuntu clamav-daemon). Installed by install.sh over /etc/clamav/clamd.conf.
# Unix socket only (no TCP listener); the API user reaches it through the clamav group.
LocalSocket /run/clamav/clamd.ctl
FixStaleSocket true
LocalSocketGroup clamav
LocalSocketMode 660
User clamav
Foreground false
LogSyslog true
LogTime true
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
# Limits match the client: a scan that exceeds them is a rejection, never a pass.
MaxThreads 8
MaxScanSize 200M
MaxFileSize 100M
StreamMaxLength 105M
MaxFiles 10000
MaxRecursion 16
AlertExceedsMax yes
# Reloading with the old database in memory would double the ~1 GB resident set on an 8 GB VM.
ConcurrentDatabaseReload no
SelfCheck 600
