name: Security & Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-audit:
    name: Supply Chain and Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyyaml jsonschema

      - name: Validate Lockfiles Integrity (SBOM)
        run: |
          sha256sum uv.lock
          sha256sum pnpm-lock.yaml

      - name: Run Secret and Egress Security Tests
        run: python -m pytest -q tests/security/test_no_sensitive_egress.py tests/security/test_ssrf_and_links.py tests/security/test_knowledge_poisoning.py tests/security/test_web_boundaries.py
