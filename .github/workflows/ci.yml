name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Settings reads ENVIRONMENT; the audit writer reads CAMPUS247_ENV. Both name the local test environment.
env:
  ENVIRONMENT: "testing"
  CAMPUS247_ENV: "test"
  OFFLINE_MODE: "true"
  OFFLINE_EVAL_MODE: "true"

jobs:
  catalog-validation:
    name: "Validate Task Catalog & DAG"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml
      - name: Validate catalog invariants
        run: |
          echo "Commit: ${{ github.sha }}"
          python -B tasks/tools/validate_catalog.py

  backend-tests:
    name: "Backend Unit & Integration Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Same as infra/cloud/install.sh: the environment comes from uv.lock, nothing is resolved at CI time.
      - name: Install from uv.lock
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen
      - name: Verify the dependency closure and hashes
        run: uv run --frozen python -B scripts/verify_dependencies.py
      - name: Run the portable regression subset
        # --ci prints the test directories it does not run; they need fixtures, model servers or databases CI does not have.
        run: |
          echo "Commit: ${{ github.sha }}"
          uv run --frozen python -B evals/runners/run_full_regression.py --ci --out .ci-evidence/regression
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-regression-${{ github.run_id }}
          path: .ci-evidence/regression
          retention-days: 14

  web-tests:
    name: "Web Unit & A11y Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.11.0"
      - name: Install the locked dependencies
        # Node and pnpm versions match infra/cloud/install.sh and build_frontend.sh.
        run: |
          npm install -g pnpm@9.12.0 --no-audit --no-fund
          pnpm install --frozen-lockfile --filter 'web...' --ignore-scripts
      - name: Type check
        run: pnpm --filter web exec tsc --noEmit
      - name: Run vitest suite
        run: |
          echo "Commit: ${{ github.sha }}"
          pnpm --filter web test

  ai-eval-gates:
    name: "AI Safety & Release Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from uv.lock
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen
      - name: Run AI adversarial gates
        run: |
          echo "Commit: ${{ github.sha }}"
          uv run --frozen python -B -m pytest -q tests/evals/test_audit_remediation_gate.py

  release-manifest-gate:
    name: "Release Manifest Verification Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from uv.lock
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen
      - name: Run release manifest verifier tests
        run: |
          echo "Commit: ${{ github.sha }}"
          uv run --frozen python -B -m pytest -q tests/delivery/test_release_manifest.py
