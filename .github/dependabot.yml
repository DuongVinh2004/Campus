# Dependabot keeps dependencies and CI actions current. Updates arrive as pull requests that must pass the same
# required CI checks as any other change. Weekly cadence and grouped minor/patch updates keep the volume small.
# Major version updates are not opened automatically (owner decision 2026-11-27): they need a migration of their own.
# The ignore rules below do not hold back security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    # apps/web is a workspace member: the root entry updates it together with pnpm-lock.yaml.
    directories: [/, /infra/cdk]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, web]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv # pyproject.toml + uv.lock (runtime dependencies are exact-pinned)
    directory: /
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, api]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /infra/cloud/docker
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(infra)"
    labels: [dependencies, infra]

  - package-ecosystem: docker-compose
    directory: /
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(infra)"
    labels: [dependencies, infra]
